name: Test basic no-trigger (workflow_dispatch)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          openrouter_api_key: "dummy-key-for-testing"
          review_model: "@preset/enkii"
          security_model: "@preset/enkii"
          enable_validator: "false"
          run_security: "true"

      - name: Assert contains_trigger is false
        env:
          ACTUAL: ${{ steps.action.outputs.contains_trigger }}
        run: |
          echo "actual contains_trigger: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected contains_trigger='false' under workflow_dispatch, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: contains_trigger is false as expected for non-PR event"

      - name: Assert no code_review_id was set
        env:
          ACTUAL: ${{ steps.action.outputs.code_review_id }}
        run: |
          echo "actual code_review_id: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected code_review_id to be empty (no trigger), got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: code_review_id is empty as expected"

      - name: Assert no security_review_id was set
        env:
          ACTUAL: ${{ steps.action.outputs.security_review_id }}
        run: |
          echo "actual security_review_id: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected security_review_id to be empty (no trigger), got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: security_review_id is empty as expected"
