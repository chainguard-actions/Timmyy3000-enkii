name: Test no-trigger on schedule event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          openrouter_api_key: "fake-api-key-for-testing"
          run_security: "false"
          enable_validator: "false"
        env:
          GITHUB_EVENT_NAME: schedule
          OVERRIDE_GITHUB_TOKEN: ${{ github.token }}

      - name: Assert contains_trigger is false for schedule event
        env:
          ACTUAL: ${{ steps.action.outputs.contains_trigger }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected contains_trigger to be 'false' for schedule event, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: contains_trigger is false as expected for schedule event"
