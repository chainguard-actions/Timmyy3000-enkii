name: Test custom model inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          openrouter_api_key: "sk-or-fake-key-for-testing-only"
          review_model: "deepseek/deepseek-r1"
          security_model: "deepseek/deepseek-r1"
          diagnostics: "false"
          run_security: "false"

      - name: Assert action ran with custom models
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONTAINS_TRIGGER: ${{ steps.action.outputs.contains_trigger }}
        run: |
          echo "outcome: $OUTCOME"
          echo "contains_trigger: $CONTAINS_TRIGGER"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom models"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo / non-PR event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
