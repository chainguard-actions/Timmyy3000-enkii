name: Test error on invalid effort value
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          ENKII_USAGE_REPORTING: "false"
        with:
          anthropic_api_key: sk-ant-test-not-a-real-key
          effort: extreme
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TRIGGER: ${{ steps.action.outputs.contains_trigger }}
        run: |
          echo "outcome: $OUTCOME"
          echo "contains_trigger: '$TRIGGER'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid effort value"
            exit 1
          fi
          if [ -n "$TRIGGER" ]; then
            echo "FAIL: contains_trigger should not be set when validation fails"
            exit 1
          fi
          echo "PASS"
