name: Test validator enabled with no trigger
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          openrouter_api_key: sk-or-test-fake-key-for-testing-only
          review_model: "@preset/enkii"
          security_model: "@preset/enkii"
          enable_validator: "true"
          run_security: "true"

      - name: Assert contains_trigger is false even with validator enabled
        env:
          ACTUAL: ${{ steps.action.outputs.contains_trigger }}
        run: |
          echo "actual contains_trigger: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected contains_trigger='false' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: contains_trigger is false as expected (no PR event, validator flag does not affect trigger detection)"
