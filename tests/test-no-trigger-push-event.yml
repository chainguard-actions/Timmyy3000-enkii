name: Test enkii - no trigger on push event
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          openrouter_api_key: "sk-or-test-dummy-key-for-ci"
          review_model: "openai/gpt-4o-mini"
          security_model: "openai/gpt-4o-mini"
          run_security: "false"
          enable_validator: "false"
        continue-on-error: true

      - name: Assert contains_trigger is false or empty on push event
        env:
          ACTUAL: ${{ steps.action.outputs.contains_trigger }}
        run: |
          echo "actual contains_trigger: '$ACTUAL'"
          if [ "$ACTUAL" = "true" ]; then
            echo "FAIL: expected contains_trigger to be false or empty on a push event"
            exit 1
          fi
          echo "PASS: contains_trigger is not 'true' on push event (got: '$ACTUAL')"
