name: Test enable_validator input accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: workflow_dispatch
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          openrouter_api_key: "sk-or-test-fake-key-for-validator-test"
          enable_validator: "true"
          run_security: "false"

      - name: Assert action succeeded with enable_validator=true on non-PR event
        env:
          ACTUAL: ${{ steps.action.outputs.contains_trigger }}
        run: |
          echo "actual contains_trigger: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected contains_trigger='false' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: action accepted enable_validator=true and correctly reported no trigger"
