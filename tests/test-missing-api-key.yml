name: Test missing API key fails fast
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          openrouter_api_key: ""
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
          OVERRIDE_GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action failed due to missing API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when openrouter_api_key is empty, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when API key is missing"
