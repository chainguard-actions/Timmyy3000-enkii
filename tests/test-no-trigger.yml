name: Test no-trigger on workflow_dispatch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          openrouter_api_key: "fake-openrouter-key-for-testing"
          review_model: "deepseek/deepseek-chat"
          security_model: "deepseek/deepseek-chat"
          run_security: "false"
          enable_validator: "false"
          incremental_review: "false"
          diagnostics: "false"
          agent_timeout_minutes: "5"

      - name: Assert no-trigger or graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONTAINS_TRIGGER: ${{ steps.action.outputs.contains_trigger }}
        run: |
          echo "outcome: $OUTCOME"
          echo "contains_trigger: $CONTAINS_TRIGGER"
          if [ "$OUTCOME" = "success" ]; then
            # On workflow_dispatch, there is no PR trigger, so contains_trigger should be false
            if [ "$CONTAINS_TRIGGER" = "false" ]; then
              echo "PASS: no trigger detected as expected on workflow_dispatch"
            elif [ -z "$CONTAINS_TRIGGER" ]; then
              echo "PASS: no trigger output (action exited early without trigger)"
            else
              echo "WARN: unexpected contains_trigger='$CONTAINS_TRIGGER' on workflow_dispatch"
              echo "PASS: action completed"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real PR context / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
