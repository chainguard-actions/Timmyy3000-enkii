name: Test no trigger on workflow_dispatch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          openrouter_api_key: "sk-or-test-fake-key-for-no-trigger-scenario"
          diagnostics: "false"

      - name: Assert contains_trigger is false or action exited gracefully
        env:
          CONTAINS_TRIGGER: ${{ steps.action.outputs.contains_trigger }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "contains_trigger: $CONTAINS_TRIGGER"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$CONTAINS_TRIGGER" = "false" ]; then
              echo "PASS: contains_trigger=false as expected for workflow_dispatch"
            elif [ -z "$CONTAINS_TRIGGER" ]; then
              echo "PASS: no trigger output set (action exited before setting it)"
            else
              echo "FAIL: expected contains_trigger=false but got '$CONTAINS_TRIGGER'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo or API key validation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
