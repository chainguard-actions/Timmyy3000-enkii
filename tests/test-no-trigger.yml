name: Test enkii - no trigger on workflow_dispatch
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          openrouter_api_key: "sk-or-test-placeholder-key-for-harness"
        continue-on-error: true

      - name: Assert contains_trigger is false or action ran gracefully
        env:
          CONTAINS_TRIGGER: ${{ steps.action.outputs.contains_trigger }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "contains_trigger: $CONTAINS_TRIGGER"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$CONTAINS_TRIGGER" != "false" ]; then
              echo "FAIL: expected contains_trigger='false' on workflow_dispatch, got '$CONTAINS_TRIGGER'"
              exit 1
            fi
            echo "PASS: contains_trigger=false as expected on workflow_dispatch"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API issue expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
