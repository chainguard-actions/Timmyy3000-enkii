name: Test security review disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          openrouter_api_key: "sk-or-test-fake-key-for-harness"
          review_model: "deepseek/deepseek-chat"
          security_model: "deepseek/deepseek-chat"
          run_security: "false"
          enable_validator: "false"
          incremental_review: "false"

      - name: Assert action ran with security disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONTAINS_TRIGGER: ${{ steps.action.outputs.contains_trigger }}
          SECURITY_REVIEW_ID: ${{ steps.action.outputs.security_review_id }}
        run: |
          echo "outcome: $OUTCOME"
          echo "contains_trigger: $CONTAINS_TRIGGER"
          echo "security_review_id: $SECURITY_REVIEW_ID"
          if [ "$OUTCOME" = "success" ]; then
            # Security is disabled, so security_review_id should be empty
            if [ -n "$SECURITY_REVIEW_ID" ]; then
              echo "FAIL: security_review_id should be empty when run_security=false, got: $SECURITY_REVIEW_ID"
              exit 1
            fi
            echo "PASS: action succeeded with security disabled, no security review posted"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo / non-PR event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
