name: Test Anthropic key with valid effort
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          ENKII_USAGE_REPORTING: "false"
        with:
          anthropic_api_key: sk-ant-test-not-a-real-key
          effort: high
          review_model: claude-sonnet-5-5
          enable_validator: "true"
          run_security: "false"
      - name: Assert contains_trigger is false
        env:
          ACTUAL: ${{ steps.action.outputs.contains_trigger }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected contains_trigger 'false'"
            exit 1
          fi
          echo "PASS"
