name: Test basic usage with OpenRouter key (no trigger on workflow_dispatch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENKII_USAGE_REPORTING: "false"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          openrouter_api_key: sk-or-test-placeholder-key
      - name: Assert contains_trigger is false
        env:
          ACTUAL: ${{ steps.action.outputs.contains_trigger }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected 'false'"
            exit 1
          fi
          echo "PASS"
      - name: Assert diagnostics outputs are set
        env:
          DPATH: ${{ steps.action.outputs.diagnostics_path }}
          DNAME: ${{ steps.action.outputs.diagnostics_name }}
        run: |
          echo "diagnostics_path: $DPATH"
          echo "diagnostics_name: $DNAME"
          if [ -z "$DPATH" ]; then
            echo "FAIL: diagnostics_path is empty"
            exit 1
          fi
          case "$DNAME" in
            enkii-diagnostics-*) ;;
            *) echo "FAIL: diagnostics_name does not start with enkii-diagnostics-"; exit 1 ;;
          esac
          if [ "$(basename "$DPATH")" != "$DNAME" ]; then
            echo "FAIL: diagnostics_name is not the basename of diagnostics_path"
            exit 1
          fi
          if [ ! -d "$DPATH" ]; then
            echo "FAIL: diagnostics directory does not exist"
            exit 1
          fi
          echo "PASS"
      - name: Assert no review ids were produced
        env:
          CODE: ${{ steps.action.outputs.code_review_id }}
          SEC: ${{ steps.action.outputs.security_review_id }}
          POL: ${{ steps.action.outputs.policy_review_id }}
        run: |
          echo "code=$CODE security=$SEC policy=$POL"
          if [ -n "$CODE$SEC$POL" ]; then
            echo "FAIL: expected no review ids"
            exit 1
          fi
          echo "PASS"
