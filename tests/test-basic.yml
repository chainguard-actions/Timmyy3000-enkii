name: Test basic usage - no trigger on workflow_dispatch
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          openrouter_api_key: "sk-or-fake-key-for-testing-only"
          diagnostics: "false"

      - name: Assert contains_trigger output is set or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONTAINS_TRIGGER: ${{ steps.action.outputs.contains_trigger }}
        run: |
          echo "outcome: $OUTCOME"
          echo "contains_trigger: $CONTAINS_TRIGGER"
          if [ "$OUTCOME" = "success" ]; then
            # On workflow_dispatch, no PR trigger should be detected
            if [ "$CONTAINS_TRIGGER" = "false" ] || [ "$CONTAINS_TRIGGER" = "" ]; then
              echo "PASS: no trigger detected on workflow_dispatch (contains_trigger='$CONTAINS_TRIGGER')"
            else
              echo "FAIL: expected contains_trigger to be false or empty on workflow_dispatch, got '$CONTAINS_TRIGGER'"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo / non-PR event)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
