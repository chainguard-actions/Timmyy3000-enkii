name: Test diagnostics output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          openrouter_api_key: "fake-openrouter-key-for-testing"
          review_model: "deepseek/deepseek-chat"
          security_model: "deepseek/deepseek-chat"
          run_security: "false"
          enable_validator: "false"
          diagnostics: "true"
          diagnostic_payloads: "false"
          agent_timeout_minutes: "5"

      - name: Assert diagnostics outputs or graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DIAGNOSTICS_PATH: ${{ steps.action.outputs.diagnostics_path }}
          DIAGNOSTICS_NAME: ${{ steps.action.outputs.diagnostics_name }}
        run: |
          echo "outcome: $OUTCOME"
          echo "diagnostics_path: $DIAGNOSTICS_PATH"
          echo "diagnostics_name: $DIAGNOSTICS_NAME"
          if [ "$OUTCOME" = "success" ]; then
            # If action succeeded, diagnostics outputs should be set
            if [ -z "$DIAGNOSTICS_NAME" ]; then
              echo "FAIL: action succeeded but diagnostics_name output is empty"
              exit 1
            fi
            echo "PASS: diagnostics_name='$DIAGNOSTICS_NAME'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real PR context / sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
