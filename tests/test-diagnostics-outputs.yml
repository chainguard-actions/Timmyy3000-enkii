name: Test diagnostics outputs are set
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          openrouter_api_key: "sk-or-test-fake-key-for-diagnostics-scenario"
          diagnostics: "true"

      - name: Assert diagnostics outputs are set or action failed gracefully
        env:
          DIAG_PATH: ${{ steps.action.outputs.diagnostics_path }}
          DIAG_NAME: ${{ steps.action.outputs.diagnostics_name }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "diagnostics_path: $DIAG_PATH"
          echo "diagnostics_name: $DIAG_NAME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$DIAG_PATH" ] && [ -n "$DIAG_NAME" ]; then
              echo "PASS: diagnostics_path='$DIAG_PATH' and diagnostics_name='$DIAG_NAME' are set"
            else
              echo "FAIL: diagnostics outputs not set despite diagnostics=true and successful run"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or API key validation)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
