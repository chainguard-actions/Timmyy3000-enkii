name: Test enkii - custom model inputs accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          openrouter_api_key: "sk-or-test-dummy-key-for-ci"
          review_model: "deepseek/deepseek-v3"
          security_model: "anthropic/claude-3-5-sonnet"
          run_security: "true"
          enable_validator: "true"
        continue-on-error: true

      - name: Assert action ran with custom model inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          CONTAINS_TRIGGER: ${{ steps.action.outputs.contains_trigger }}
        run: |
          echo "action outcome: '$OUTCOME'"
          echo "contains_trigger: '$CONTAINS_TRIGGER'"
          # The action should start up and process inputs without crashing on input validation.
          # On a push event with no PR, contains_trigger should be false (not true).
          if [ "$OUTCOME" = "success" ] && [ "$CONTAINS_TRIGGER" = "true" ]; then
            echo "FAIL: unexpected trigger detected on a push event"
            exit 1
          fi
          echo "PASS: action handled custom model inputs correctly"
